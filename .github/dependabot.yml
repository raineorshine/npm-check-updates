version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    cooldown:
      default-days: 7
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'docker'
    directory: '/'
    cooldown:
      default-days: 7
    schedule:
      interval: 'monthly'
  - package-ecosystem: 'npm'
    directory: '/'
    cooldown:
      default-days: 7
    exclude-paths:
      - 'test/test-data/**'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase'
    groups:
      # markdownlint-cli2 pins markdownlint, so bumping one without the other duplicates it in the lockfile
      markdownlint:
        patterns:
          - 'markdownlint'
          - 'markdownlint-cli2'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
