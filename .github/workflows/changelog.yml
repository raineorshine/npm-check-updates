name: Changelog

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: changelog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'raineorshine/npm-check-updates'

    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Generate CHANGELOG.md from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${{ github.repository }}/releases" > releases.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs'

          const intro =
            'This file is automatically generated from the [GitHub releases page](https://github.com/raineorshine/npm-check-updates/releases).'

          /** @type {{ tag_name: string, body: string | null, draft: boolean, published_at: string | null }[]} */
          const allReleases = JSON.parse(fs.readFileSync('releases.json', 'utf8'))

          const releases = allReleases
            .filter(release => !release.draft && release.published_at)
            .sort((a, b) => new Date(b.published_at).getTime() - new Date(a.published_at).getTime())

          const shiftHeadings = (body) =>
            body.replace(/\r\n/g, '\n').replace(/^(#{1,6})(?=\s)/gm, (_, hashes) => '#'.repeat(Math.min(hashes.length + 2, 6)))

          const sections = releases.map(release => {
            const version = release.tag_name.replace(/^v/, '')
            const date = release.published_at.slice(0, 10)
            const body = shiftHeadings((release.body ?? '').trim())
            return body ? `## [${version}] - ${date}\n\n${body}` : `## [${version}] - ${date}`
          })

          const changelog = `# Changelog\n\n${intro}${sections.length > 0 ? `\n\n${sections.join('\n\n')}` : ''}\n`
          fs.writeFileSync('CHANGELOG.md', changelog)
          EOF
          rm releases.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo 'CHANGELOG.md is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: update CHANGELOG.md from releases [skip ci]'
          git push origin HEAD:main
