name: Changelog

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Print the CHANGELOG.md diff without committing or pushing'
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: changelog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'raineorshine/npm-check-updates'

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generate CHANGELOG.md from releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-changelog.ts

      - name: Show CHANGELOG.md diff
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo 'CHANGELOG.md is already up to date.'
          else
            {
              echo '## CHANGELOG.md diff'
              echo
              echo '```diff'
              git --no-pager diff --stat -- CHANGELOG.md
              echo
              git --no-pager diff -- CHANGELOG.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff -- CHANGELOG.md
          fi

      # CHANGELOG_TOKEN bypasses branch protection on main, so it is exposed to this step only, and never written to
      # the git config where it would be readable by every later command
      - name: Commit and push if changed
        if: inputs.dry-run != true
        env:
          CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo 'CHANGELOG.md is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: update CHANGELOG.md from releases [skip ci]'

          remote="https://x-access-token:${CHANGELOG_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
