name: Tests

on:
  push:
    branches:
      - main
      - '!dependabot/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  FORCE_COLOR: 2

permissions:
  contents: read

jobs:
  run:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Corepack is not bundled with Node >= 25.
      # --force is needed to overwrite the runner's preinstalled global yarn.
      - name: Install corepack
        shell: bash
        run: | # zizmor: ignore[adhoc-packages] corepack is a build tool, not a project dependency
          if [[ "$(node -p 'process.versions.node.split(".")[0]')" -ge 25 ]]; then
            npm install -g --force corepack
          fi

      - name: Enable yarn via corepack
        run: corepack enable yarn

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm run test:unit
